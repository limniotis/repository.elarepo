name: Update live channel data

# Pull the maintained upstreams (komhsgr M3U + Twilight0 gist JSON), apply live/overrides.json,
# and commit live/gr_ch.json + live/greek.m3u. Runs on GitHub's network, which can reach the
# Greek CDNs and probe stream URLs. The add-on fetches these files from raw.githubusercontent.

on:
  schedule:
    - cron: '17 4 * * *'   # daily, 04:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-live
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh live data
        run: python3 live/update_live.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- live/gr_ch.json live/greek.m3u; then
            echo "No change."
          else
            git add live/gr_ch.json live/greek.m3u
            git commit -m "live data: refresh from upstreams + overrides [skip ci]"
            git push
          fi

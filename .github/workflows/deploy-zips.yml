name: Deploy zips to Enhance

# Push-based mirror of the Kodi distribution: whenever the built zips change on main,
# upload zips/ to repo.elarepo.org/zips over FTP. The repo stays private; GitHub does
# the pushing because the Enhance plan has no Git-pull feature. Credentials live only in
# repository Secrets (Settings -> Secrets and variables -> Actions), never in this file.

on:
  push:
    branches: [main]
    paths: ['zips/**']
  workflow_dispatch: {}

concurrency:
  group: deploy-zips
  cancel-in-progress: true

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload zips/ to repo.elarepo.org/zips
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./zips/
          server-dir: /zips/
